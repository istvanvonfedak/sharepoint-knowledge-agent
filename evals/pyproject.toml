[project]
name = "sharepoint-evals"
version = "0.1.0"
description = "Inspect AI evals for permissions, extraction, retrieval and sharepoint_ask"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.200", "agent-client-protocol>=0.12,<1",  # 1.0 dropped acp.helpers, which inspect-ai imports
    "sharepoint-rag", "sharepoint-client", "mcp-server",  # the agent tier runs sharepoint_ask itself
    "psycopg[binary]>=3.2", "pgvector>=0.4", "psutil>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sharepoint_evals"]

[tool.setuptools.package-data]
sharepoint_evals = ["dataset/*.md", "rubrics/*.md"]
