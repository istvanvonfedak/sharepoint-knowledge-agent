# Start everything:  docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# ../.env holds the shared settings and is read here (--env-file) to fill in ${...}; no container gets it whole.
# Secrets are split: the mcp-server reads ../.env.mcp (its own Entra app), the sync-worker reads ../.env.worker (a
# separate Entra app with app-only Graph access). Neither container ever sees the other's secret.

x-db-url: &db-url postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/sharepoint_rag
x-inference-key: &inference-key ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env}

services:
  mcp-server:
    build:
      context: ..
      dockerfile: apps/mcp-server/Dockerfile
    env_file: ../.env.mcp  # copy .env.mcp.example
    environment:
      # Must match the redirect URI registered in Entra (PUBLIC_URL/oauth/callback, default http://localhost:8080).
      PORT: "8080"
      MCP_BIND_HOST: 0.0.0.0
      DATABASE_URL: *db-url
      INFERENCE_URL: http://inference-server:8000
      INFERENCE_API_KEY: *inference-key
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      UNRESOLVED_ACL_POLICY: ${UNRESOLVED_ACL_POLICY:-hide}
      # Used by sharepoint_ask (OpenAI by default). With ASK_MODEL=none or another provider, set this to "" so
      # only the inference-server holds the key: this is the most exposed service. A Gemini ASK_MODEL takes
      # GEMINI_API_KEY from .env.mcp.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # sharepoint_ask's code interpreter (docs/code-interpreter.md): off, or local with the sandbox service below.
      ASK_SANDBOX: ${ASK_SANDBOX:-off}
      SANDBOX_URL: http://sandbox:8000
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-}
    restart: unless-stopped
    ports:
      # Loopback only: the server is plain HTTP, reachable from this machine alone.
      - "127.0.0.1:8080:8080"
    depends_on:
      db: {condition: service_healthy}
      inference-server: {condition: service_started}
    networks: [default, backend, sandbox]

  sync-worker:
    build:
      context: ..
      dockerfile: apps/sync-worker/Dockerfile
    env_file:
      - path: ../.env.worker  # copy .env.worker.example; the worker refuses to start without its credentials
        required: false
    environment:
      DATABASE_URL: *db-url
      INFERENCE_URL: http://inference-server:8000
      INFERENCE_API_KEY: *inference-key
      # Whichever service migrates first seeds index generation 1 and its model, so both must agree.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      UNRESOLVED_ACL_POLICY: ${UNRESOLVED_ACL_POLICY:-hide}
      SYNC_AZURE_CERT_PATH: /run/secrets/sync-worker-cert
    secrets: [sync-worker-cert]  # the app's private key + certificate, mounted read-only, never baked into the image
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      inference-server: {condition: service_started}
    networks: [default, backend]  # default: it needs Microsoft Graph
    # More replicas: docker compose ... up -d --scale sync-worker=3 (they coordinate through Postgres).

  inference-server:
    build:
      context: ..
      dockerfile: apps/inference-server/Dockerfile
    restart: unless-stopped
    environment:
      INFERENCE_API_KEY: *inference-key
      # Chunk text is sent to the embedding model's provider: Google, or OpenAI for an openai: generation.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_EMBED_TOKENS_PER_MINUTE: ${OPENAI_EMBED_TOKENS_PER_MINUTE:-900000}
      # Embedding runs with their token counts (never document text) in LangSmith, if tracing is on in .env.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_AGENT_ID: ${LANGSMITH_AGENT_ID:-}
      LANGSMITH_AGENT_ENVIRONMENT: ${LANGSMITH_AGENT_ENVIRONMENT:-}
    networks: [default, backend]

  # Runs sharepoint_ask's shell commands (ASK_SANDBOX=local). Started only with --profile sandbox. Commands are
  # model-written, so it holds no secrets but its own key, and its network reaches nothing but the mcp-server.
  sandbox:
    profiles: [sandbox]
    build:
      context: ..
      dockerfile: apps/sandbox/Dockerfile
    # gVisor: nsjail needs the privileges below, which must not reach the host kernel. Docker Desktop on a Mac has no
    # gVisor: SANDBOX_RUNTIME=runc there, for development only.
    runtime: ${SANDBOX_RUNTIME:-runsc}
    environment:
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-}  # the service refuses to start without one
    cap_add: [SYS_ADMIN, SETUID, SETGID, CHOWN]  # namespaces and mounts per command, and the per-session uids
    security_opt:
      - seccomp=unconfined  # Docker's profile blocks the unshare and mount calls nsjail makes
      - apparmor=unconfined
      - systempaths=unconfined  # each command mounts its own /proc, which Docker's masked paths prevent
    read_only: true  # everything outside /tmp
    tmpfs:
      - /tmp:size=64m,mode=1777  # sessions are tmpfs mounts of their own below it, each capped
    mem_limit: 4g  # session files live in memory
    pids_limit: 1024
    restart: unless-stopped
    networks: [sandbox]

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # No default: set it in the root .env and start with `--env-file .env`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sharepoint_rag
    ports:
      # Loopback only, for the CLIs and evals on the host. The index holds everything the crawler can read.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharepoint_rag"]
      interval: 5s
      retries: 10
    networks: [backend]

networks:
  backend:
  sandbox:
    internal: true  # no route out: only the mcp-server and the sandbox are on it

volumes:
  pgdata:

secrets:
  sync-worker-cert:
    file: ${SYNC_CERT_FILE:-../secrets/sync-worker.pem}  # docs/setup.md, sync-worker app step 7
