[project]
name = "sharepoint-rag"
version = "0.1.0"
description = "pgvector schema, database access and Gemini embeddings for SharePoint retrieval"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "psycopg[binary,pool]>=3.2", "pgvector>=0.4", "python-dotenv>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sharepoint_rag"]

[tool.setuptools.package-data]
sharepoint_rag = ["schema.sql"]
