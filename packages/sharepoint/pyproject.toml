[project]
name = "sharepoint-client"
version = "0.1.0"
description = "Entra ID delegated/app-only auth and Microsoft Graph client for SharePoint"
requires-python = ">=3.11"
dependencies = ["msal>=1.39", "httpx>=0.28", "defusedxml>=0.7", "python-dotenv>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sharepoint_client"]
