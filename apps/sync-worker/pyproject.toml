[project]
name = "sync-worker"
version = "0.1.0"
description = "Keeps the SharePoint index and its permissions in step with SharePoint (app-only Graph access)"
requires-python = ">=3.11"
dependencies = ["msal>=1.39", "httpx>=0.28", "python-dotenv>=1.2", "sharepoint-rag"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sync_worker"]
