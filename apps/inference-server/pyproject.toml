[project]
name = "inference-server"
version = "0.1.0"
description = "Embedding service (hosted OpenAI or Gemini) for the SharePoint index"
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.54", "pydantic>=2", "sharepoint-rag"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inference_server"]
