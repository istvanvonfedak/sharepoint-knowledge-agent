[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing SharePoint tools at /api/mcp"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.54", "langgraph>=1.2", "langchain>=1.5", "langchain-google-genai>=4.5", "langsmith>=0.15", "sharepoint-client", "sharepoint-rag"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]
